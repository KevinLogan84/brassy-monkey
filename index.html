<!DOCTYPE html>
<html lang="en" style="color-scheme: only light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Brassy Monkey Salon &amp; Barber Shop</title>
  <meta name="description" content="Book with Misty Patterson at Brassy Monkey Salon & Barber Shop in Tecumseh, OK." />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#F3E6CF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Brassy Monkey" />
  <link rel="icon" href="apple-touch-icon.png?v=3" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: only light;
      --cream: #F3E6CF;
      --paper: #FFF8EC;
      --ink: #1C1916;
      --muted: #6B645B;
      --line: rgba(60, 40, 10, .12);
      --gold: #C4A052;
      --gold-deep: #8A6A2A;
      --red: #C4121C;
      --red-deep: #8E0C14;
      --ok: #1F7A3A;
      --fill: #FFFFFF;
      --shadow: 0 8px 28px rgba(60, 36, 10, .08);
      --radius: 20px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    html { color-scheme: only light; scroll-padding-bottom: 96px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--cream); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -8%, rgba(196,160,82,.2), transparent 58%),
        var(--cream);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    button, input, select, textarea {
      font: inherit;
      color: var(--ink);
      background: var(--fill);
    }
    button { color: inherit; }
    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: calc(10px + var(--safe-t)) 16px calc(28px + var(--safe-b));
    }
    header.brand { text-align: center; padding: 4px 0 2px; }
    .logo-ring {
      width: min(260px, 72vw);
      height: min(260px, 72vw);
      margin: 0 auto 2px;
      border-radius: 0;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      display: block;
      background: transparent;
    }
    .wordmark {
      font-family: Playball, Palatino, serif;
      font-size: clamp(34px, 9.5vw, 50px);
      line-height: .95;
      margin: 2px 0 0;
      color: var(--ink);
    }
    .submark {
      font-weight: 600;
      letter-spacing: .16em;
      font-size: 11px;
      margin: 8px 0 0;
      color: var(--muted);
    }
    body[data-page="home"] .wrap {
      padding: calc(2px + var(--safe-t)) 16px calc(6px + var(--safe-b));
    }
    body[data-page="home"] header.brand { padding: 0; }
    body[data-page="home"] .logo-ring {
      width: min(132px, 34vw);
      height: min(132px, 34vw);
    }
    body[data-page="home"] .wordmark {
      font-size: clamp(28px, 7.4vw, 34px);
      margin: 0;
    }
    body[data-page="home"] .submark { margin: 1px 0 0; font-size: 10px; letter-spacing: .14em; }
    body[data-page="home"] .card { padding: 10px 12px; margin: 6px 0; }
    body[data-page="home"] .stack { gap: 8px; }
    body[data-page="home"] .facts { gap: 1px; font-size: 13px; line-height: 1.25; }
    body[data-page="home"] .facts strong { font-size: 15px; }
    body[data-page="home"] .btn { min-height: 42px; font-size: 16px; border-radius: 12px; }
    body[data-page="home"] h2 { font-size: 20px; margin: 0 0 6px; }
    body[data-page="home"] .hours-list li {
      min-height: 0;
      padding: 4px 12px;
      font-size: 14px;
    }
    body[data-page="home"] footer {
      padding: 2px 8px 0;
      font-size: 12px;
      line-height: 1.3;
    }
    body[data-page]:not([data-page="home"]) header.brand .logo-ring {
      width: 108px;
      height: 108px;
    }
    body[data-page]:not([data-page="home"]) .wordmark { font-size: 28px; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin: 12px 0;
    }
    .facts { display: grid; gap: 6px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.35; }
    .facts strong { color: var(--ink); display: block; font-size: 17px; font-weight: 600; }
    .hours-list { margin: 0; padding: 0; list-style: none; background: var(--fill); border-radius: 14px; overflow: hidden; }
    .hours-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
      padding: 10px 14px;
      font-size: 16px;
      color: var(--ink);
    }
    .hours-list li + li { border-top: .5px solid var(--line); }
    .hours-list li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .hours-list .hour-note {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: normal;
      line-height: 1.3;
      max-width: 220px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      -webkit-appearance: none;
      appearance: none;
    }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:active:not(:disabled) { opacity: .88; }
    .btn-gold { background: var(--gold); color: #1C1916; }
    .btn-ghost {
      background: var(--fill);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stack { display: grid; gap: 12px; }
    h2 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin: 0 0 4px;
    }
    h3 {
      margin: 8px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .muted { color: var(--muted); }
    .service {
      width: 100%;
      text-align: left;
      background: var(--fill);
      border: 0;
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 64px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .service.selected { box-shadow: inset 0 0 0 2px var(--red); }
    .service small { color: var(--muted); font-size: 14px; }
    .price { font-weight: 600; font-variant-numeric: tabular-nums; }
    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      padding: 2px 2px 8px;
      margin: 0 -4px;
    }
    .chip {
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 0;
      background: var(--fill);
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 64px;
      min-height: 72px;
      cursor: pointer;
      display: grid;
      place-items: center;
      gap: 2px;
    }
    .chip b { font-size: 22px; font-weight: 600; line-height: 1; }
    .chip span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .chip.selected, .slot.selected { background: var(--ink); color: #fff; box-shadow: none; }
    .chip.selected span { color: rgba(255,255,255,.72); }
    .chip:disabled { opacity: .32; }
    .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 420px) { .slots { grid-template-columns: repeat(3, 1fr); } }
    .slot {
      border: 0;
      background: var(--fill);
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: 12px;
      min-height: 48px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 590;
    }
    label.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    input:not([type="checkbox"]):not([type="radio"]), select, textarea {
      width: 100%;
      min-height: 48px;
      border: 0;
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--fill);
      color: var(--ink);
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"], input[type="time"], input[type="number"] { min-height: 48px; }
    .open-check {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }
    .open-check input {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      min-height: 26px;
      margin: 0;
      padding: 0;
      flex: none;
      border-radius: 8px;
      background: var(--fill);
      box-shadow: inset 0 0 0 1.5px var(--line);
      display: grid;
      place-items: center;
    }
    .open-check input:checked {
      background: var(--red);
      box-shadow: none;
    }
    .open-check input:checked::after {
      content: "";
      width: 7px;
      height: 12px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .hour-row.is-closed .hour-times { opacity: .35; pointer-events: none; }
    textarea { min-height: 96px; resize: vertical; }
    .err { color: var(--red); font-size: 15px; margin: 0; }
    .ok { color: var(--ok); }
    .notice {
      background: rgba(196, 18, 28, .08);
      color: var(--red-deep);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.4;
    }
    .booking.blocked { background: rgba(60, 40, 10, .05); }
    .hidden { display: none !important; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 18px 8px 4px;
    }
    footer a { text-decoration: none; font-weight: 500; }
    .owner-link { margin-top: 10px; }
    body[data-page="home"] .owner-link { margin-top: 2px; }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px;
      background: rgba(60, 40, 10, .06);
      border-radius: 12px;
    }
    .tab {
      flex: 1 0 auto;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 8px 10px;
      min-height: 34px;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
    }
    .tab.on { background: var(--fill); color: var(--ink); box-shadow: 0 1px 3px rgba(40,24,8,.1); }
    .booking {
      background: var(--fill);
      border-radius: 14px;
      padding: 14px;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .booking + .booking { margin-top: 10px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cal-head strong { font-size: 17px; }
    .cal-nav {
      width: 40px; min-height: 40px; border: 0; border-radius: 10px;
      background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); font-size: 18px;
      -webkit-appearance: none; appearance: none;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
    .cal-day {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--fill);
      box-shadow: inset 0 0 0 1px var(--line);
      padding: 4px 2px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 14px;
      font-weight: 600;
      -webkit-appearance: none;
      appearance: none;
    }
    .cal-day.out { opacity: .28; }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--gold); }
    .cal-day.on { background: var(--ink); color: #fff; box-shadow: none; }
    .cal-day:disabled { opacity: .32; cursor: not-allowed; }
    .cal-nav:disabled { opacity: .35; }
    .cal-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--red);
    }
    .cal-day.on .cal-dot { background: #fff; }
    .tiny { font-size: 13px; }
    .hour-row {
      display: grid;
      gap: 8px;
      background: var(--fill);
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .hour-row .hour-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hour-row .hour-times { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .svc-edit { background: var(--fill); border-radius: 14px; padding: 12px; display: grid; gap: 8px; box-shadow: inset 0 0 0 1px var(--line); }
    .svc-edit + .svc-edit { margin-top: 10px; }
    .svc-edit.is-off { opacity: .55; }
    #qrbox { display: flex; justify-content: center; padding: 12px; background: var(--fill); border-radius: 14px; }
    .pin { letter-spacing: .28em; text-align: center; font-size: 28px; font-weight: 700; background: var(--fill); }
    .confirm-box { text-align: center; }
    .confirm-box .check {
      width: 58px; height: 58px; margin: 0 auto 10px;
      border-radius: 50%; background: var(--red); color: #fff;
      display: grid; place-items: center; font-size: 28px;
    }
    .dock {
      position: sticky;
      bottom: 0;
      z-index: 4;
      display: grid;
      gap: 10px;
      padding: 12px 0 calc(8px + var(--safe-b));
      background: linear-gradient(180deg, rgba(243,230,207,0), var(--cream) 28%);
    }
    .badge {
      display: inline;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--red);
    }
    .owner-out {
      position: sticky;
      bottom: 0;
      z-index: 3;
      margin: 8px -16px -18px;
      padding: 12px 16px 10px;
      background: linear-gradient(180deg, rgba(255,248,236,0), var(--paper) 26%);
      border-top: .5px solid var(--line);
    }
    .sheet-bg {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(28, 25, 22, .46);
      display: grid;
      place-items: end center;
      padding: 16px 16px calc(16px + var(--safe-b));
    }
    .sheet {
      width: min(520px, 100%);
      background: var(--paper);
      border-radius: 20px;
      padding: 22px 18px 16px;
      box-shadow: 0 16px 40px rgba(40, 24, 8, .22);
    }
    .sheet h2 { font-size: 22px; margin-bottom: 8px; }
    .sheet p { margin: 0 0 12px; color: var(--muted); line-height: 1.45; }
    .sheet-bg.center { place-items: center; }
    .sheet.saved { text-align: center; }
    @media (prefers-color-scheme: dark) {
      :root, html, body {
        color-scheme: only light;
        --cream: #F3E6CF;
        --paper: #FFF8EC;
        --ink: #1C1916;
        --muted: #6B645B;
        --line: rgba(60, 40, 10, .12);
        --fill: #FFFFFF;
      }
      html, body { background: #F3E6CF; color: #1C1916; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="logo-ring"><img src="logo-crop.jpg?v=3" alt="Brassy Monkey logo" /></div>
      <p class="wordmark">Brassy Monkey</p>
      <p class="submark">SALON &amp; BARBER SHOP</p>
    </header>

    <main id="app"></main>

    <footer>
      <div>1011 N Broadway, Suite 3 · Tecumseh, OK</div>
      <div><a href="tel:+19187586486">918-758-6486</a> · <a href="https://www.facebook.com/profile.php?id=61591742622203" target="_blank" rel="noopener">Facebook</a></div>
      <div class="owner-link"><a href="#/owner">Owner</a></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script>
    const SHOP = {
      name: "Brassy Monkey",
      stylist: "Misty Patterson",
      role: "Barber Stylist",
      phone: "918-758-6486",
      tel: "+19187586486",
      address: "1011 N Broadway, Suite 3",
      city: "Tecumseh, OK",
      facebook: "https://www.facebook.com/profile.php?id=61591742622203",
      tz: "America/Chicago"
    };
    const SB_URL = "https://kaopminkiwnjtednhmxq.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthb3BtaW5raXduanRlZG5obXhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODYzNTgsImV4cCI6MjEwMjc2MjM1OH0.mIjPx1nIxVmbxKj6YX7_7rLNLJkzRWvdY6JKg8OiD-U";
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const PIN_KEY = "bm-owner-pin";
    const TZ = SHOP.tz;
    const QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm";

    const state = {
      route: "home",
      step: 1,
      services: [],
      hours: [],
      slots: [],
      service: null,
      date: null,
      time: null,
      name: "",
      phone: "",
      note: "",
      confirmation: null,
      ownerTab: "bookings",
      bookings: [],
      bookView: "list",
      calCursor: null,
      calDay: null,
      bookCal: null,
      error: "",
      offline: false,
      loading: false,
      showDepositModal: false,
      depositAccepted: false,
      savedNote: "",
      cashTag: "",
      paidClaimed: false
    };

    function publicUrl() {
      const u = new URL(location.href);
      u.hash = "";
      u.search = "";
      return u.toString().replace(/index\.html$/, "");
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function errText(e) {
      const m = e?.message || String(e || "Something went wrong");
      return m.replace(/^.*ERROR:\s*/i, "").replace(/P0001:\s*/i, "").split("\n")[0];
    }
    function money(n) {
      if (n == null || n === "") return "";
      const v = Number(n);
      return Number.isInteger(v) ? `$${v}` : `$${v.toFixed(2)}`;
    }
    function depositCopy(s) {
      const m = money(s?.deposit_amount);
      return m ? `${m} deposit` : "deposit";
    }
    function bookableServices() {
      return state.services.filter(s => s.active === true);
    }
    function cashTagOf(tag) {
      return String(tag || "").replace(/^[$@\s]+/, "").replace(/\s/g, "");
    }
    function cashAppUrl(tag, amount) {
      const t = cashTagOf(tag);
      if (!t) return "";
      const n = Number(amount);
      const amt = Number.isFinite(n) && n > 0 ? (Number.isInteger(n) ? String(n) : n.toFixed(2)) : "";
      return amt ? `https://cash.app/$${encodeURIComponent(t)}/${amt}` : `https://cash.app/$${encodeURIComponent(t)}`;
    }
    function depositFromForm(form) {
      if (!form.requires_deposit.checked) return null;
      const raw = form.deposit_amount.value;
      return raw === "" ? null : Number(raw);
    }
    function ymdInTz(date = new Date()) {
      return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
    }
    function zonedTimeToUtc(ymd, hm) {
      const [y, m, d] = ymd.split("-").map(Number);
      const [hh, mm] = String(hm).slice(0, 5).split(":").map(Number);
      const target = Date.UTC(y, m - 1, d, hh, mm);
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      });
      const asUtc = (ms) => {
        const p = Object.fromEntries(fmt.formatToParts(new Date(ms)).map(x => [x.type, x.value]));
        return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
      };
      let guess = target;
      for (let i = 0; i < 4; i++) guess += target - asUtc(guess);
      return new Date(guess);
    }
    function weekdayInTz(ymd) {
      const name = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" }).format(zonedTimeToUtc(ymd, "12:00"));
      return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(name);
    }
    function formatClock(date) {
      return new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(date);
    }
    function formatDay(ymd) {
      const dt = zonedTimeToUtc(ymd, "12:00");
      return new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" }).format(dt);
    }
    function dayParts(ymd) {
      const dt = zonedTimeToUtc(ymd, "12:00");
      return {
        dow: new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" }).format(dt),
        num: new Intl.DateTimeFormat("en-US", { timeZone: TZ, day: "numeric" }).format(dt)
      };
    }
    function formatFull(date) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit"
      }).format(date);
    }
    function hmOf(date) {
      const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(date).map(x => [x.type, x.value]));
      return `${p.hour}:${p.minute}`;
    }
    function hoursFor(ymd) {
      return state.hours.find(h => Number(h.dow) === weekdayInTz(ymd));
    }
    function prettyHours(h) {
      if (!h) return "";
      if (h.closed) return "Closed";
      const a = formatClock(zonedTimeToUtc("2026-01-05", String(h.open_time).slice(0, 5)));
      const b = formatClock(zonedTimeToUtc("2026-01-05", String(h.close_time).slice(0, 5)));
      return `${a} – ${b}`;
    }
    function generateSlots(ymd, minutes, taken) {
      const h = hoursFor(ymd);
      if (!h || h.closed) return [];
      const open = zonedTimeToUtc(ymd, h.open_time);
      const close = zonedTimeToUtc(ymd, h.close_time);
      const step = 15 * 60 * 1000;
      const now = Date.now() + 5 * 60 * 1000;
      const out = [];
      for (let t = open.getTime(); t + minutes * 60000 <= close.getTime(); t += step) {
        if (t < now) continue;
        const end = t + minutes * 60000;
        if (taken.some(r => t < r.end && end > r.start)) continue;
        out.push(new Date(t));
      }
      return out;
    }
    function ownerPin() { return sessionStorage.getItem(PIN_KEY) || ""; }
    function resetBooking() {
      state.step = 1;
      state.service = null;
      state.date = null;
      state.time = null;
      state.note = "";

    function setHash(route) {
      if (location.hash !== "#/" + route && location.hash !== "#" + route) {

      }

    async function loadCatalog() {
      const [{ data: services, error: e1 }, { data: hours, error: e2 }, shop] = await Promise.all([
        sb.from("services").select("*").order("sort"),
        sb.from("shop_hours").select("*").order("dow"),
        sb.rpc("public_shop_info")
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      state.offline = false;
      state.services = services || [];
      state.hours = hours || [];
      state.cashTag = cashTagOf(shop.data?.cash_tag);
      if (state.service && state.service.active !== true) {
        const fresh = state.services.find(s => s.id === state.service.id);
        if (!fresh || fresh.active !== true) {
          state.service = null;
          state.date = null;
          state.time = null;
        } else {
          state.service = fresh;
        }
      } else if (state.service) {
        state.service = state.services.find(s => s.id === state.service.id) || state.service;
      }
    }
    async function loadTaken() {
      const { data, error } = await sb.from("slots").select("start_at,end_at,status").in("status", ["booked", "blocked"]);
      if (error) throw error;
      state.slots = (data || []).map(s => ({ start: new Date(s.start_at).getTime(), end: new Date(s.end_at).getTime() }));
    }

    function routeFromHash() {
      const h = (location.hash || "#/").replace(/^#\/?/, "");
      if (h.startsWith("owner")) return "owner";
      if (h.startsWith("book")) return "book";
      if (h.startsWith("done")) return "done";
      return "home";
    }

    function render() {

      else if (state.route === "done") root.innerHTML = viewDone();

      bind();

    function viewHome() {

    function viewBook() {
      const step = state.step;
      const titles = ["Choose a service", "Pick a day", "Pick a time", "Your details"];
      return `
        <section class="card stack">

    function viewServices() {
      const list = bookableServices();
      if (state.offline) return "";
      if (!list.length) return `<p class="muted">No services are open for booking right now.</p>`;
      return list.map(s => `
        <button class="service ${state.service?.id === s.id ? "selected" : ""}" data-service="${s.id}" type="button">
          <div><strong>${esc(s.name)}</strong><br><small>${s.minutes} min</small>${s.requires_deposit ? ` <span class="badge">/ Non-refundable deposit ${esc(money(s.deposit_amount))}</span>` : ""}</div>
          <div class="price">${esc(money(s.price))}</div>
        </button>`).join("");
    }
    function viewDates() {
      if (!state.service) return `<p class="muted">Pick a service first.</p>`;
      const minutes = state.service.minutes;
      const today = ymdInTz();
      const horizon = addMonthsYmd(today, 3);
      const thisMonth = monthStart(today);
      const lastMonth = monthStart(horizon);
      if (!state.bookCal || state.bookCal < thisMonth || state.bookCal > lastMonth) state.bookCal = thisMonth;
      const dayOpen = (ymd) => ymd >= today && ymd <= horizon && generateSlots(ymd, minutes, state.slots).length > 0;
      const monthHasOpening = (cursor) => {
        const [cy, cm] = cursor.split("-").map(Number);
        const n = new Date(Date.UTC(cy, cm, 0)).getUTCDate();
        for (let d = 1; d <= n; d++) {
          if (dayOpen(`${cy}-${String(cm).padStart(2, "0")}-${String(d).padStart(2, "0")}`)) return true;
        }
        return false;
      };
      if (!state.date) {
        let cursor = state.bookCal;
        while (cursor < lastMonth && !monthHasOpening(cursor)) cursor = shiftMonth(cursor, 1);
        if (monthHasOpening(cursor)) state.bookCal = cursor;
      }
      const [y, m] = state.bookCal.split("-").map(Number);
      const first = new Date(Date.UTC(y, m - 1, 1));
      const startPad = first.getUTCDay();
      const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const title = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric", timeZone: "UTC" }).format(first);
      const cells = [];
      for (let i = 0; i < startPad; i++) cells.push(`<div></div>`);
      for (let day = 1; day <= daysIn; day++) {
        const ymd = `${y}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const open = dayOpen(ymd);
        cells.push(`<button class="cal-day ${ymd === today ? "today" : ""} ${state.date === ymd ? "on" : ""}" data-date="${ymd}" ${open ? "" : "disabled"} type="button">
          ${day}${open ? `<span class="cal-dot"></span>` : ""}
        </button>`);
      }
      return `
        <div class="stack">
          <p class="muted tiny">Red-dot days have an opening long enough for this ${minutes}-minute visit.</p>
          <div class="cal-head">
            <button class="cal-nav" id="bookCalPrev" type="button" ${state.bookCal > thisMonth ? "" : "disabled"} aria-label="Previous month">‹</button>
            <strong>${esc(title)}</strong>
            <button class="cal-nav" id="bookCalNext" type="button" ${state.bookCal < lastMonth ? "" : "disabled"} aria-label="Next month">›</button>
          </div>
          <div class="cal-grid">
            ${["S","M","T","W","T","F","S"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${cells.join("")}
          </div>
        </div>`;
    }
    function viewTimes() {
      if (!state.service || !state.date) return `<p class="muted">Pick a service and date first.</p>`;
      const times = generateSlots(state.date, state.service.minutes, state.slots);
      if (!times.length) return `<p class="muted">No open times that day for a ${state.service.minutes}-minute visit. Try another day.</p>`;
      return `<div class="slots">${times.map(t => `
        <button class="slot ${state.time && +state.time === +t ? "selected" : ""}" data-time="${t.toISOString()}" type="button">${esc(formatClock(t))}</button>
      `).join("")}</div>`;
    }

    function canNext() {
      if (state.step === 1) return !!(state.service && state.service.active === true);

      if (state.step === 3) return !!state.time;
      return true;
    }

          ${pay ? `<a class="btn btn-red" id="cashPay" href="${esc(pay)}" target="_blank" rel="noopener">Pay ${esc(money(c.deposit_amount))} on Cash App</a>` : `<p class="err">Cash App is not set up yet. Text the shop.</p>`}
          ${state.error ? `<p class="err">${esc(state.error)}</p>` : ""}
          ${state.paidClaimed || c.client_paid_claim

            : `<button class="btn btn-gold" id="paidBtn" type="button">I paid the deposit</button>`}
          <a class="btn btn-ghost" href="sms:${SHOP.tel}">Text ${esc(SHOP.phone)}</a>
          <a class="btn btn-ghost" href="#/">Done</a>

          <button class="btn btn-red" id="icsBtn" type="button">Add to calendar</button>
          <a class="btn btn-ghost" href="sms:${SHOP.tel}">Text ${esc(SHOP.phone)}</a>
          <a class="btn btn-ghost" href="#/">Done</a>
        </section>`;

            <p>This appointment is <strong>not confirmed</strong> until you pay that deposit and she marks it received. Once paid, the deposit is <strong>non-refundable</strong>.</p>

    function monthStart(ymd) {
      return ymd.slice(0, 8) + "01";
    }
    function addMonthsYmd(ymd, months) {
      const [y, m, d] = ymd.split("-").map(Number);
      const last = new Date(Date.UTC(y, m - 1 + months + 1, 0)).getUTCDate();
      const dt = new Date(Date.UTC(y, m - 1 + months, Math.min(d, last)));
      return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, "0")}-${String(dt.getUTCDate()).padStart(2, "0")}`;
    }
    function shiftMonth(cursor, delta) {
      const [y, m] = cursor.split("-").map(Number);
      const d = new Date(Date.UTC(y, m - 1 + delta, 1));
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-01`;
    }
    function bookingsOn(ymd) {
      return state.bookings.filter(b => (b.status === "booked" || b.status === "done") && ymdInTz(new Date(b.start_at)) === ymd);
    }
    function prettyStatus(b) {
      if (b.status === "pending_deposit") return b.client_paid_claim ? "Paid — confirm it" : "Awaiting deposit";
      return b.status;
    }
    function bookingCard(b) {
      if (isBlock(b)) {
        return `
        <article class="booking blocked">
          <strong>${esc(formatFull(new Date(b.start_at)))} – ${esc(formatClock(new Date(b.end_at)))}</strong>
          <div>Blocked · ${esc(b.client_name)}</div>
          ${b.status === "booked" ? `<div class="btn-row" style="margin-top:8px">
            <button class="btn btn-ghost" data-cancel="${b.id}" type="button">Remove block</button>
          </div>` : ""}
        </article>`;
      }
      return `
        <article class="booking">
          <strong>${esc(formatFull(new Date(b.start_at)))}</strong>
          <div>${esc(b.service_name)} · ${b.minutes} min · ${esc(prettyStatus(b))}</div>
          <div>${esc(b.client_name)} · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></div>
          ${b.note ? `<div class="muted">${esc(b.note)}</div>` : ""}
          ${b.status === "pending_deposit" ? `
            <div class="muted tiny">Requested ${esc(formatFull(new Date(b.created_at)))}</div>
            <p class="${b.client_paid_claim ? "ok" : "badge"}">${b.client_paid_claim ? "Client says they paid on Cash App." : `Awaiting ${esc(money(b.deposit_amount))} Cash App deposit`}</p>
            <div class="btn-row" style="margin-top:8px">
              <button class="btn btn-gold" data-deposit-ok="${b.id}" type="button">Deposit received</button>
              <button class="btn btn-ghost" data-cancel="${b.id}" type="button">Cancel</button>
            </div>` : ""}
          ${b.status === "booked" ? `<div class="btn-row" style="margin-top:8px">
            <button class="btn btn-gold" data-done="${b.id}" type="button">Done</button>
            <button class="btn btn-ghost" data-cancel="${b.id}" type="button">Cancel</button>
          </div>` : ""}
        </article>`;
    }
    function viewOwnerCalendar() {
      if (!state.calCursor) state.calCursor = monthStart(ymdInTz());
      const today = ymdInTz();
      const [y, m] = state.calCursor.split("-").map(Number);
      const first = new Date(Date.UTC(y, m - 1, 1));
      const startPad = first.getUTCDay();
      const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const title = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric", timeZone: "UTC" }).format(first);
      const cells = [];
      for (let i = 0; i < startPad; i++) cells.push(`<div></div>`);
      for (let day = 1; day <= daysIn; day++) {
        const ymd = `${y}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const count = bookingsOn(ymd).length;
        const on = state.calDay === ymd;
        cells.push(`<button class="cal-day ${ymd === today ? "today" : ""} ${on ? "on" : ""}" data-cal-day="${ymd}" type="button">
          ${day}${count ? `<span class="cal-dot"></span>` : ""}
        </button>`);
      }
      const selected = state.calDay ? bookingsOn(state.calDay) : [];
      return `
        <div class="stack">
          <div class="cal-head">
            <button class="cal-nav" id="calPrev" type="button" aria-label="Previous month">‹</button>
            <strong>${esc(title)}</strong>
            <button class="cal-nav" id="calNext" type="button" aria-label="Next month">›</button>
          </div>
          <div class="cal-grid">
            ${["S","M","T","W","T","F","S"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${cells.join("")}
          </div>
          ${state.calDay ? `<h3>${esc(formatDay(state.calDay))}</h3>${selected.length ? selected.map(bookingCard).join("") : `<p class="muted">Nothing booked this day.</p>`}` : `<p class="muted">Tap a day to see appointments.</p>`}
        </div>`;
    }
    function viewOwnerBookings() {
      const pending = state.bookings.filter(b => b.status === "pending_deposit");
      const upcoming = state.bookings.filter(b => b.status === "booked" && new Date(b.end_at) >= Date.now() - 3600000);
      const past = state.bookings.filter(b => (b.status === "booked" || b.status === "done") && new Date(b.end_at) < Date.now() - 3600000);
      const list = (items) => items.length ? items.map(bookingCard).join("") : `<p class="muted">None yet.</p>`;
      return `
        <div class="stack">
          <div class="tabs">
            <button class="tab ${state.bookView === "list" ? "on" : ""}" data-book-view="list" type="button">List</button>
            <button class="tab ${state.bookView === "calendar" ? "on" : ""}" data-book-view="calendar" type="button">Calendar</button>
          </div>
          <button class="btn btn-ghost" id="ownerCalShare" type="button">Add bookings to calendar</button>
          ${pending.length ? `<h3>Awaiting deposit</h3>${list(pending)}` : ""}
          ${state.bookView === "calendar" ? viewOwnerCalendar() : `
            <h3>Scheduled appointments</h3>
            ${list(upcoming)}
          `}
          <div class="stack">
            <h3>Block time</h3>
            <label class="field">Date <input type="date" id="blockDate" /></label>
            <div class="btn-row">
              <label class="field">Start <input type="time" id="blockStart" value="12:00" /></label>
              <label class="field">End <input type="time" id="blockEnd" value="13:00" /></label>
            </div>
            <label class="field">Label <input id="blockLabel" placeholder="Lunch, running late…" /></label>
            <button class="btn btn-gold" id="blockBtn" type="button">Block this time</button>
          </div>
          ${state.bookView === "list" ? `<h3>Past</h3>${list(past)}` : ""}
        </div>`;
    }
    function viewOwnerHours() {
      return `<form id="hoursForm" class="stack">
        ${state.hours.map(h => `
          <div class="hour-row ${h.closed ? "is-closed" : ""}">
            <div class="hour-top">
              <strong>${esc(h.name)}</strong>
              <label class="open-check">
                <input type="checkbox" name="isopen-${h.dow}" ${h.closed ? "" : "checked"} data-open-day />
                <span class="check-label">${h.closed ? "Closed" : "Open"}</span>
              </label>
            </div>
            <div class="hour-times">
              <input type="time" name="open-${h.dow}" value="${String(h.open_time).slice(0, 5)}" />
              <span class="muted">to</span>
              <input type="time" name="close-${h.dow}" value="${String(h.close_time).slice(0, 5)}" />
            </div>
            <label class="field">Note on the main page
              <input name="note-${h.dow}" maxlength="80" placeholder="${h.closed ? "Closed due to emergency" : "Shown under this day's hours"}" value="${esc(h.note || "")}" />
            </label>
          </div>`).join("")}
        <button class="btn btn-red" type="submit">Save hours</button>
      </form>`;
    }
    function viewOwnerServices() {
      return `
        <div class="stack">
          ${state.services.map(s => `
            <form class="svc-edit ${s.active ? "" : "is-off"}" data-id="${s.id}">
              <input name="name" value="${esc(s.name)}" />
              <div class="btn-row">
                <label class="field">Price <input name="price" type="number" min="0" step="0.01" value="${s.price ?? ""}" /></label>
                <label class="field">Minutes <input name="minutes" type="number" min="5" step="5" value="${s.minutes}" /></label>
              </div>
              <label class="open-check"><input type="checkbox" name="active" ${s.active ? "checked" : ""} data-bookable /> Clients can book this</label>
              <label class="open-check"><input type="checkbox" name="requires_deposit" ${s.requires_deposit ? "checked" : ""} data-deposit-toggle /> Requires Non-refundable Deposit</label>
              <label class="field deposit-amt ${s.requires_deposit ? "" : "hidden"}">Deposit amount
                <input name="deposit_amount" type="number" min="1" step="0.01" inputmode="decimal" value="${s.deposit_amount ?? ""}" ${s.requires_deposit ? "" : "disabled"} />
              </label>
              <p class="err form-err hidden"></p>
              <div class="btn-row">
                <button class="btn btn-red" type="submit">Save</button>
                <button class="btn btn-ghost" data-del="${s.id}" type="button">Delete</button>
              </div>
            </form>`).join("")}
          <form class="svc-edit" id="newSvc">
            <h3>Add a service</h3>
            <input name="name" placeholder="Service name" />
            <div class="btn-row">
              <label class="field">Price <input name="price" type="number" min="0" step="0.01" /></label>
              <label class="field">Minutes <input name="minutes" type="number" min="5" step="5" value="45" /></label>
            </div>
            <label class="open-check"><input type="checkbox" name="requires_deposit" data-deposit-toggle /> Requires Non-refundable Deposit</label>
            <label class="field deposit-amt hidden">Deposit amount
              <input name="deposit_amount" type="number" min="1" step="0.01" inputmode="decimal" disabled />
            </label>
            <p class="err form-err hidden"></p>
            <button class="btn btn-gold" type="submit">Add service</button>
          </form>
        </div>`;
    }
    function viewOwnerOther() {
      const url = publicUrl();
      const sms = `sms:&body=${encodeURIComponent("Book at Brassy Monkey: " + url)}`;
      return `
        <div class="stack">
          <h3>Share the booking link</h3>
          <p>Text, post, or print this as a QR code.</p>
          <input readonly value="${esc(url)}" id="shareUrl" />
          <button class="btn btn-red" id="copyBtn" type="button">Copy link</button>
          <a class="btn btn-ghost" href="${sms}">Text the link</a>
          <button class="btn btn-ghost" id="shareBtn" type="button">Share…</button>
          <a class="btn btn-ghost" href="${esc(SHOP.facebook)}" target="_blank" rel="noopener">Open Facebook</a>
          <div id="qrbox"><canvas id="qr"></canvas></div>
          <button class="btn btn-gold" id="qrDl" type="button">Download QR</button>
          <h3>Cash App deposit</h3>
          <p>Clients pay the deposit to this $cashtag. Those appointments stay off your calendar until you tap Deposit received.</p>
          <label class="field">Cash App $cashtag
            <input id="cashTag" autocomplete="off" spellcheck="false" placeholder="$yourcashtag" value="${state.cashTag ? esc("$" + state.cashTag) : ""}" />
          </label>
          <button class="btn btn-red" id="cashSave" type="button">Save Cash App</button>
          <h3>Change PIN</h3>
          <label class="field">New PIN
            <input class="pin" id="newPin" inputmode="numeric" maxlength="8" autocomplete="off" />
          </label>
          <label class="field">Type it again
            <input class="pin" id="newPin2" inputmode="numeric" maxlength="8" autocomplete="off" />
          </label>
          <button class="btn btn-gold" id="pinSave" type="button">Save PIN</button>
        </div>`;
    }

    function bind() {
      document.getElementById("backBtn")?.addEventListener("click", () => {
        if (state.step === 1) location.hash = "#/";
        else { state.step -= 1; state.error = ""; render(); }
      });
      document.getElementById("nextBtn")?.addEventListener("click", async () => {
        if (!canNext()) return;
        state.step += 1;
        state.error = "";
        if (state.step === 2 || state.step === 3) {
          try { await loadTaken(); } catch (e) { state.error = errText(e); }
        }
        render();
      });
      document.querySelectorAll("[data-service]").forEach(el => el.addEventListener("click", () => {
        state.service = state.services.find(s => s.id === el.dataset.service);
        state.date = null;
        state.time = null;
        state.depositAccepted = false;
        state.showDepositModal = false;
        render();
      }));
      document.getElementById("depositOk")?.addEventListener("click", () => {
        state.depositAccepted = true;
        state.showDepositModal = false;
        confirmBook();
      });
      document.getElementById("depositCancel")?.addEventListener("click", () => {
        state.showDepositModal = false;
        state.loading = false;
        render();
      });
      document.getElementById("depositSheet")?.addEventListener("click", e => {
        if (e.target.id !== "depositSheet") return;
        state.showDepositModal = false;
        state.loading = false;
        render();
      });
      document.querySelectorAll("[data-date]").forEach(el => el.addEventListener("click", () => {
        state.date = el.dataset.date;
        state.time = null;
        render();
      }));
      document.querySelectorAll("[data-time]").forEach(el => el.addEventListener("click", () => {
        state.time = new Date(el.dataset.time);
        render();
      }));
      document.getElementById("name")?.addEventListener("input", e => state.name = e.target.value);
      document.getElementById("phone")?.addEventListener("input", e => state.phone = e.target.value);
      document.getElementById("note")?.addEventListener("input", e => state.note = e.target.value);
      document.getElementById("bookBtn")?.addEventListener("click", confirmBook);
      document.getElementById("icsBtn")?.addEventListener("click", downloadIcs);
      document.getElementById("pinBtn")?.addEventListener("click", ownerLogin);
      document.getElementById("pin")?.addEventListener("keydown", e => { if (e.key === "Enter") ownerLogin(); });
      document.getElementById("signOut")?.addEventListener("click", () => { sessionStorage.removeItem(PIN_KEY); state.savedNote = ""; render(); });
      const dismissSaved = () => { state.savedNote = ""; render(); };
      document.getElementById("savedOk")?.addEventListener("click", dismissSaved);
      document.getElementById("savedSheet")?.addEventListener("click", e => {
        if (e.target.id === "savedSheet") dismissSaved();
      });
      document.querySelectorAll("[data-deposit-toggle]").forEach(el => el.addEventListener("change", () => {
        const form = el.closest("form");
        const field = form.querySelector(".deposit-amt");
        const input = form.deposit_amount;
        field.classList.toggle("hidden", !el.checked);
        input.disabled = !el.checked;
        if (el.checked) input.focus();
      }));
      document.getElementById("pinSave")?.addEventListener("click", changePin);
      document.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => {
        state.ownerTab = el.dataset.tab;
        state.error = "";
        render();
      }));
      document.querySelectorAll("[data-book-view]").forEach(el => el.addEventListener("click", () => {
        state.bookView = el.dataset.bookView;
        render();
      }));
      document.getElementById("ownerCalShare")?.addEventListener("click", shareOwnerCalendar);
      document.getElementById("calPrev")?.addEventListener("click", () => {
        state.calCursor = shiftMonth(state.calCursor || monthStart(ymdInTz()), -1);
        render();
      });
      document.getElementById("calNext")?.addEventListener("click", () => {
        state.calCursor = shiftMonth(state.calCursor || monthStart(ymdInTz()), 1);
        render();
      });
      document.getElementById("bookCalPrev")?.addEventListener("click", () => {
        state.bookCal = shiftMonth(state.bookCal || monthStart(ymdInTz()), -1);
        render();
      });
      document.getElementById("bookCalNext")?.addEventListener("click", () => {
        state.bookCal = shiftMonth(state.bookCal || monthStart(ymdInTz()), 1);
        render();
      });
      document.querySelectorAll("[data-cal-day]").forEach(el => el.addEventListener("click", () => {
        state.calDay = el.dataset.calDay;
        render();
      }));
      document.getElementById("blockBtn")?.addEventListener("click", blockTime);
      document.querySelectorAll("[data-done]").forEach(el => el.addEventListener("click", () => setStatus(el.dataset.done, "done")));
      document.querySelectorAll("[data-deposit-ok]").forEach(el => el.addEventListener("click", () => setStatus(el.dataset.depositOk, "booked")));
      document.querySelectorAll("[data-cancel]").forEach(el => el.addEventListener("click", () => setStatus(el.dataset.cancel, "cancelled")));
      document.getElementById("cashSave")?.addEventListener("click", saveCashTag);
      document.getElementById("paidBtn")?.addEventListener("click", claimDepositPaid);
      document.querySelectorAll("[data-bookable]").forEach(el => el.addEventListener("change", () => {
        const form = el.closest("form");
        form.classList.toggle("is-off", !el.checked);
        saveService({ preventDefault() {} }, form);
      }));
      document.getElementById("hoursForm")?.addEventListener("submit", saveHours);
      document.querySelectorAll("[data-open-day]").forEach(el => el.addEventListener("change", () => {
        const row = el.closest(".hour-row");
        row.classList.toggle("is-closed", !el.checked);
        row.querySelector(".check-label").textContent = el.checked ? "Open" : "Closed";
        const note = row.querySelector("input[name^='note-']");
        if (note && !note.value) note.placeholder = el.checked ? "Shown under this day's hours" : "Closed due to emergency";
      }));
      document.querySelectorAll("form.svc-edit[data-id]").forEach(form => form.addEventListener("submit", e => saveService(e, form)));
      document.getElementById("newSvc")?.addEventListener("submit", addService);
      document.querySelectorAll("[data-del]").forEach(el => el.addEventListener("click", () => deleteService(el.dataset.del)));
      document.getElementById("copyBtn")?.addEventListener("click", copyLink);
      document.getElementById("shareBtn")?.addEventListener("click", nativeShare);
      document.getElementById("qrDl")?.addEventListener("click", downloadQr);
      if (state.route === "owner" && state.ownerTab === "other") drawQr();
    }

    async function confirmBook() {
      state.error = "";
      if (state.service?.active !== true) {
        state.error = "That service is not open for booking.";
        state.service = null;
        state.step = 1;
        render();
        return;
      }
      if (state.service?.requires_deposit && !cashTagOf(state.cashTag)) {
        state.error = "This service needs a Cash App deposit. The shop has not added a $cashtag yet.";
        render();
        return;
      }
      if (state.service?.requires_deposit && !state.depositAccepted) {
        state.showDepositModal = true;
        state.loading = false;
        render();
        return;
      }
      state.loading = true;
      render();
      try {
        const { data, error } = await sb.rpc("create_booking", {
          p_service_id: state.service.id,
          p_start: state.time.toISOString(),
          p_name: state.name,
          p_phone: state.phone,
          p_note: state.note || null
        });
        if (error) throw error;
        state.confirmation = data;
        state.paidClaimed = false;
        state.loading = false;
        location.hash = "#/done";
      } catch (e) {
        state.loading = false;
        state.error = errText(e);
        render();
      }
    }
    function stampLocal(date) {
      const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      }).formatToParts(date).map(x => [x.type, x.value]));
      return `${p.year}${p.month}${p.day}T${p.hour}${p.minute}${p.second}`;
    }
    function downloadIcs() {
      const c = state.confirmation;
      if (!c) return;
      const ics = [
        "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Brassy Monkey//Booking//EN", "CALSCALE:GREGORIAN",
        "BEGIN:VEVENT",
        `DTSTART;TZID=America/Chicago:${stampLocal(new Date(c.start_at))}`,
        `DTEND;TZID=America/Chicago:${stampLocal(new Date(c.end_at))}`,
        `SUMMARY:Brassy Monkey — ${c.service_name}`,
        `DESCRIPTION:With ${SHOP.stylist}`,
        `LOCATION:${SHOP.address}\\, ${SHOP.city}`,
        "END:VEVENT", "END:VCALENDAR"
      ].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      a.download = "brassy-monkey.ics";
      a.click();
    }
    function ownerCalendarIcs() {
      const items = state.bookings.filter(b => b.status === "booked" && new Date(b.end_at) >= Date.now() - 3600000);
      const events = items.map(b => [
        "BEGIN:VEVENT",
        `UID:${b.id}@brassymonkey`,
        `DTSTART;TZID=America/Chicago:${stampLocal(new Date(b.start_at))}`,
        `DTEND;TZID=America/Chicago:${stampLocal(new Date(b.end_at))}`,
        `SUMMARY:${(b.service_name || "Appointment").replace(/[,\\;]/g, " ")} — ${(b.client_name || "").replace(/[,\\;]/g, " ")}`,
        `DESCRIPTION:${(b.phone || "")}${b.note ? "\\n" + String(b.note).replace(/\n/g, "\\n") : ""}`,
        `LOCATION:${SHOP.address}\\, ${SHOP.city}`,
        "END:VEVENT"
      ].join("\r\n"));
      return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Brassy Monkey//Owner//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...events, "END:VCALENDAR"].join("\r\n");
    }
    async function shareOwnerCalendar() {
      const ics = ownerCalendarIcs();
      const file = new File([ics], "brassy-monkey-bookings.ics", { type: "text/calendar" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "Brassy Monkey bookings" });
          return;
        } catch {}
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      a.click();
    }
    async function ownerLogin() {
      const pin = (document.getElementById("pin")?.value || "").trim();
      state.error = "";
      const { data, error } = await sb.rpc("owner_check_pin", { pin });
      if (error || !data) { state.error = "Try again."; render(); return; }
      sessionStorage.setItem(PIN_KEY, pin);
      await refreshOwner();
      render();
    }
    async function changePin() {
      const next = (document.getElementById("newPin")?.value || "").trim();
      const again = (document.getElementById("newPin2")?.value || "").trim();
      state.error = "";
      if (next !== again) { showError("Those PINs did not match."); return; }
      const { error } = await sb.rpc("owner_change_pin", { pin: ownerPin(), new_pin: next });
      if (error) { showError(error); return; }
      sessionStorage.setItem(PIN_KEY, next);
      showSaved("Your PIN is saved.");
    }
    async function refreshOwner() {
      const pin = ownerPin();
      const [{ data, error }, cat] = await Promise.all([
        sb.rpc("owner_list_bookings", { pin }),
        loadCatalog()
      ]);
      if (error) throw error;
      state.bookings = data || [];
    }
    async function setStatus(id, status) {
      state.error = "";
      const target = state.bookings.find(b => b.id === id);
      const { error } = await sb.rpc("owner_set_booking_status", { pin: ownerPin(), p_id: id, p_status: status });
      if (error) { showError(error); return; }
      await refreshOwner();
      const note = status === "booked" ? "Deposit received. Appointment is confirmed."
        : status === "done" ? "Appointment marked done."
        : target && isBlock(target) ? "That time is open again."
        : "Appointment cancelled.";
      showSaved(note);
    }
    async function saveCashTag() {
      const raw = document.getElementById("cashTag")?.value || "";
      state.error = "";
      const { error } = await sb.rpc("owner_save_cashtag", { pin: ownerPin(), p_cash_tag: raw });
      if (error) { showError(error); return; }
      state.cashTag = cashTagOf(raw);
      showSaved("Cash App $cashtag is saved.");
    }
    async function claimDepositPaid() {
      const id = state.confirmation?.id;
      if (!id) return;
      state.error = "";
      const { error } = await sb.rpc("claim_deposit_paid", { p_id: id });
      if (error) { state.error = errText(error); render(); return; }
      state.paidClaimed = true;
      if (state.confirmation) state.confirmation.client_paid_claim = true;
      render();
    }
    async function blockTime() {
      const date = document.getElementById("blockDate").value;
      const start = document.getElementById("blockStart").value;
      const end = document.getElementById("blockEnd").value;
      const label = document.getElementById("blockLabel").value;
      if (!date || !start || !end) { showError("Pick a date and times."); return; }
      if (end <= start) { showError("End time must be after start."); return; }
      const { error } = await sb.rpc("owner_block_time", {
        pin: ownerPin(),
        p_start: zonedTimeToUtc(date, start).toISOString(),
        p_end: zonedTimeToUtc(date, end).toISOString(),
        p_label: label || "Blocked"
      });
      if (error) { showError(error); return; }
      await refreshOwner();
      showSaved("That time is blocked.");
    }
    async function saveHours(e) {
      e.preventDefault();
      const form = e.target;
      const hours = state.hours.map(h => ({
        dow: h.dow,
        name: h.name,
        closed: !form[`isopen-${h.dow}`].checked,
        open_time: form[`open-${h.dow}`].value,
        close_time: form[`close-${h.dow}`].value,
        note: form[`note-${h.dow}`].value
      }));
      const { error } = await sb.rpc("owner_save_hours", { pin: ownerPin(), p_hours: hours });
      if (error) { showError(error); return; }
      await loadCatalog();
      showSaved("Your hours are saved.");
    }
    async function saveService(e, form) {
      e.preventDefault();
      const { error } = await sb.rpc("owner_save_service", {
        pin: ownerPin(),
        p_id: form.dataset.id,
        p_name: form.name.value,
        p_price: form.price.value === "" ? null : Number(form.price.value),
        p_minutes: Number(form.minutes.value),
        p_active: form.active.checked,
        p_requires_deposit: form.requires_deposit.checked,
        p_deposit_amount: depositFromForm(form),
        p_sort: state.services.find(s => s.id === form.dataset.id)?.sort ?? 0
      });
      if (error) { showFormError(form, error); return; }
      await loadCatalog();
      showSaved("This service is saved.");
    }
    async function addService(e) {
      e.preventDefault();
      const form = e.target;
      const { error } = await sb.rpc("owner_save_service", {
        pin: ownerPin(),
        p_id: null,
        p_name: form.name.value,
        p_price: form.price.value === "" ? null : Number(form.price.value),
        p_minutes: Number(form.minutes.value || 45),
        p_active: true,
        p_requires_deposit: form.requires_deposit.checked,
        p_deposit_amount: depositFromForm(form),
        p_sort: (state.services.at(-1)?.sort || 0) + 1
      });
      if (error) { showFormError(form, error); return; }
      await loadCatalog();
      showSaved("Service added.");
    }
    async function deleteService(id) {
      if (!confirm("Delete this service?")) return;
      const { error } = await sb.rpc("owner_delete_service", { pin: ownerPin(), p_id: id });
      if (error) { showError(error); return; }
      await loadCatalog();
      showSaved("Service deleted.");
    }
    async function copyLink() {
      try {
        await navigator.clipboard.writeText(publicUrl());
        document.getElementById("copyBtn").textContent = "Copied";
      } catch {
        document.getElementById("shareUrl").select();
      }
    }
    async function nativeShare() {
      const url = publicUrl();
      if (navigator.share) {
        try { await navigator.share({ title: "Brassy Monkey", text: "Book at Brassy Monkey Salon", url }); } catch {}
      } else {
        copyLink();
      }
    }
    let qrLib = null;
    async function drawQr() {
      const canvas = document.getElementById("qr");
      if (!canvas) return;
      try {
        qrLib ??= await import(QR_LIB);
        const lib = qrLib.default || qrLib;
        await lib.toCanvas(canvas, publicUrl(), { width: 220, margin: 1, color: { dark: "#14110E", light: "#FFFFFF" } });
      } catch {
        document.getElementById("qrbox")?.classList.add("hidden");
        document.getElementById("qrDl")?.classList.add("hidden");
      }
    }
    function downloadQr() {
      const canvas = document.getElementById("qr");
      if (!canvas) return;
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "brassy-monkey-qr.png";
      a.click();
    }

    async function boot() {
      try {
        await loadCatalog();
        if (routeFromHash() === "owner" && ownerPin()) {
          try { await refreshOwner(); } catch (e) { sessionStorage.removeItem(PIN_KEY); state.error = errText(e); }
        }
      } catch (e) {
        state.offline = true;
        state.error = "";
      }
      render();
    }
    window.addEventListener("hashchange", async () => {
      state.error = "";
      const next = routeFromHash();
      if (next === "book" && state.route !== "book") {
        resetBooking();
        if (state.offline) {
          try { await loadCatalog(); } catch {}
        }
      }
      if (next === "owner" && ownerPin()) {
        try { await refreshOwner(); } catch (e) { state.error = errText(e); }
      }
      render();
    });
    boot();
  </script>
</body>
</html>
